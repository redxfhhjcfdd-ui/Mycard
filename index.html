 <!DOCTYPE html> 
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Teacher Card</title>

  <!-- 1. เชื่อมโยง Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 2. เชื่อมโยง Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 3. ไฟล์ CSS ส่วนบุคคล -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
        <div class="student-card">
            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <img src="public/KTCM.png" alt="KTCM Logo" class="w-12 h-12">
                </div>
                <h1 class="university-name">Kanchanaphisek Technical College Mahanakorn</h1>
            </div>

            <!-- Curved decoration -->
            <div class="curve-container">
                <svg viewBox="0 0 600 60" preserveAspectRatio="none" class="curve-svg">
                    <path d="M0,0 L600,0 L600,20 Q300,80 0,20 Z" fill="#2c5d8f"/>
                    <path d="M0,15 Q300,70 600,15 L600,25 Q300,85 0,25 Z" fill="#a8c4d9"/>
                </svg>
            </div>

            <!-- Content -->
            <div class="content">
                <div class="photo-section">
                    <div class="photo-frame">
                        <img src="public/red1.jpg" alt="Student Photo" class="student-photo"/>
                    </div>
                </div>
                
                <div class="info-section">
                    <h2 class="title">STUDENT</h2>
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="label">Name</span> <span class="colon">:</span> 
                            <span class="value">Thanawat Udsirirattanakul</span>
                        </div>
                        <div class="info-row">
                            <span class="label">ID Number</span> <span class="colon">:</span>
                            <span class="value">69219010010</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Birth of Date</span> <span class="colon">:</span>
                            <span class="value">20 oct 2009</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Phone</span> <span class="colon">:</span>
                            <span class="value">064-850-9423</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Address</span> <span class="colon">:</span>
                            <span class="value">Ladkrabang</span>
                        </div>
                    </div>
                    <!-- พื้นที่แสดงบาร์โค้ด -->
                   <div class="barcode-container">
                     <canvas id="barcodeCanvas" width="250" height="50" class="barcode"></canvas>
                   </div>

<!-- ส่วนปุ่มกดที่บูรณาการ Bootstrap, Icon และ JavaScript -->
                   <div class="text-center mt-3 mb-3">
                        <button id="themeToggleBtn" class="btn btn-dark">
    	                <i class="fa-solid fa-moon me-2"></i>สลับโหมดมืด / สว่าง
	                    </button>
                   </div>

                     <a href="https://github.com/redxfhhjcfdd-ui" target="_blank" class="btn btn-primary" onclick="showAlert()">
                       <i class="fa-brands fa-github me-2"></i>เยี่ยมชมโซเชียลมีเดียของฉัน
                     </a>
                   </div>
                </div>
            </div>
            <!-- Footer -->
            <div class="footer"></div>
        </div>
    </div>
    <!-- เรียกใช้ไฟล์ JavaScript ภายนอกไว้ด้านล่างสุด -->
    <script src="script.js"></script>
</body>
</html>
